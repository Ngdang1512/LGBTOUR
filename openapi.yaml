  # ══════════════════════════════════════════
  # PAYMENTS
  # ══════════════════════════════════════════
  /payments/vnpay/create:
    post:
      tags: [Payments]
      summary: Tạo VNPay payment order
      description: Trả về paymentUrl để redirect user đến VNPay thanh toán.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVNPayOrderRequest'
      responses:
        "200":
          description: Order đã được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVNPayOrderResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "422":
          description: User đã có giao dịch Pending đang xử lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: payment_already_pending
                message: You already have a pending payment. Please complete or wait for it to expire.

  /payments/vnpay/webhook:
    post:
      tags: [Payments]
      summary: VNPay IPN webhook endpoint
      description: |
        **KHÔNG dùng trực tiếp từ client.** Endpoint này chỉ nhận request từ VNPay server.

        Bảo mật:
        - IP whitelist (chỉ accept VNPay IPs)
        - HMAC-SHA512 signature verification bắt buộc
      security: []
      parameters:
        - name: vnp_TxnRef
          in: query
          required: true
          schema:
            type: string
        - name: vnp_ResponseCode
          in: query
          required: true
          schema:
            type: string
        - name: vnp_SecureHash
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: IPN response (VNPay yêu cầu luôn trả 200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  RspCode:
                    type: string
                    example: "00"
                  Message:
                    type: string
                    example: Confirm Success

  /payments/vnpay/return:
    get:
      tags: [Payments]
      summary: Return URL sau khi VNPay redirect user về
      security: []
      parameters:
        - name: vnp_TxnRef
          in: query
          required: true
          schema:
            type: string
        - name: vnp_ResponseCode
          in: query
          required: true
          schema:
            type: string
        - name: vnp_SecureHash
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Kết quả thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VNPayReturnResponse'

  /payments/history:
    get:
      tags: [Payments]
      summary: Lịch sử giao dịch của user hiện tại
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentTransaction'
                  meta:
                    $ref: '#/components/schemas/PaginatedMeta'
        "401":
          $ref: '#/components/responses/Unauthorized'

