      tags: [Narrations]
      summary: Cập nhật nội dung narration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contentText:
                  type: string
                isPremium:
                  type: boolean
                voiceType:
                  type: string
                  enum: [male, female]
      responses:
        "200":
          description: Narration đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Narration'
        "403":
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [Narrations]
      summary: Xoá narration
      responses:
        "204":
          description: Đã xoá
        "403":
          $ref: '#/components/responses/Forbidden'

