      summary: Lấy narration cho một POI
      description: |
        Trả về narration phù hợp với ngôn ngữ và tier của user.
        - User free: chỉ nhận narration có `isPremium=false`
        - User premium: nhận tất cả
      parameters:
        - name: poiId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: query
          schema:
            type: string
            enum: [vi, en]
            default: vi
      responses:
        "200":
          description: Narration phù hợp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Narration'
        "404":
          description: Không có narration cho POI này với ngôn ngữ yêu cầu

    post:
      tags: [Narrations]
      summary: Tạo narration mới cho POI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNarrationRequest'
      responses:
        "201":
          description: Narration đã được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Narration'
        "400":
          $ref: '#/components/responses/ValidationError'
        "403":
          $ref: '#/components/responses/Forbidden'

  /narrations/{id}:
    parameters:
      - name: id
        in: path
        required: true
