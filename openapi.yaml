  # ══════════════════════════════════════════
  # QR LOGIN
  # ══════════════════════════════════════════
  /qr/generate:
    post:
      tags: [QR Login]
      summary: Tạo QR login token (Browser/TV)
      security: []
      responses:
        "200":
          description: QR token đã được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrGenerateResponse'

  /qr/status/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [QR Login]
      summary: Kiểm tra trạng thái QR token (polling fallback)
      description: |
        Browser dùng SignalR để nhận kết quả realtime.
        Endpoint này là fallback cho môi trường không hỗ trợ WebSocket.
      security: []
      responses:
        "200":
          description: QR token status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrStatusResponse'
        "404":
          $ref: '#/components/responses/NotFound'

  /qr/scan/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [QR Login]
      summary: Mobile app xác nhận QR token
      description: |
        Mobile user đã đăng nhập (có JWT) scan QR và confirm cho browser.
        API sẽ push JWT pair cho browser qua SignalR.
      responses:
        "200":
          description: Đã confirm. Browser sẽ nhận token qua SignalR.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: QR login confirmed. The browser session has been authenticated.
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: Token không tồn tại hoặc đã hết hạn
        "409":
          description: Token đã được scan rồi

